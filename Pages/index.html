<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Kibo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- VARIABLES Y CONFIGURACIÓN BASE --- */
        :root {
            --bg: #f0f2f5;       /* Fondo general un poco más suave */
            --card: #ffffff;     
            --accent: #7986cb;   /* Morado Kibo */
            --accent-light: #e8eaf6; /* Morado muy claro para hovers */
            --text-main: #333333;
            --text-muted: #666666;
            
            --sidebar-width: 260px;
            --sidebar-bg: #ffffff;
            
            --state-good: #dcedc8; --text-good: #33691e;
            --state-bad: #ffcdd2; --text-bad: #b71c1c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            height: 100vh; 
            display: flex; 
            overflow: hidden; 
            background: var(--bg); 
            color: var(--text-main);
        }

        /* --- SIDEBAR ESTILO GEMINI/MODERNO --- */
        .sidebar { 
            width: var(--sidebar-width); 
            background-color: var(--sidebar-bg); 
            display: flex; 
            flex-direction: column; 
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); 
            padding: 20px 15px; 
            border-right: 1px solid rgba(0,0,0,0.05); /* Separación sutil */
            flex-shrink: 0;
            z-index: 100;
        }

        .sidebar.cerrado { 
            width: 0; 
            padding: 20px 0; 
            opacity: 0;
            overflow: hidden;
        }

        /* Título / Logo */
        .brand {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 30px;
            padding-left: 47px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;/* Un poco más de espacio para que respire la imagen */
        }

        /* ESTILO PARA LA IMAGEN DEL LOGO PEQUEÑO */
        .brand img {
            height: 32px; /* Tamaño pequeñito y controlado */
            width: auto;  /* Mantiene la proporción */
            object-fit: contain;
        }

        /* Enlaces del menú */
        .menu-items { 
            display: flex; 
            flex-direction: column; 
            gap: 5px; /* Espacio entre botones */
            flex-grow: 1;
        }

        .menu-items a { 
            display: flex; 
            align-items: center; 
            text-decoration: none; 
            color: var(--text-muted); 
            font-size: 15px; 
            font-weight: 500;
            padding: 12px 15px; 
            border-radius: 50px; /* Forma de píldora */
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        /* Iconos SVG */
        .menu-items a svg {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            fill: currentColor; /* El icono toma el color del texto */
            opacity: 0.7;
        }

        /* Hover y Activo */
        .menu-items a:hover { 
            background-color: var(--accent-light); 
            color: var(--accent); 
        }
        
        .menu-items a.activo-page {
            background-color: var(--accent-light); 
            color: var(--accent); 
            font-weight: 700;
        }

        /* Estilo especial Admin */
        #linkAdmin { 
            color: #b71c1c; 
            display: none; /* Se activa con JS */
            margin-top: 10px;
            background-color: #fff0f0;
        }
        #linkAdmin:hover { background-color: #ffebee; }

        /* Botón Cerrar Sesión (Footer Sidebar) */
        .sidebar-footer {
            margin-top: auto;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .btn-logout {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid #eee;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .btn-logout:hover {
            background-color: #ffebee;
            color: #d32f2f;
            border-color: #ffcdd2;
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .main-content { 
            flex: 1; 
            padding: 30px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative;
        }

        .header-top {
            width: 100%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-menu { 
            font-size: 24px; 
            cursor: pointer; 
            background: white; 
            border: none; 
            color: #555; 
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.2s;
            margin-right: 20px;
        }
        .btn-menu:hover { background: #f5f5f5; }

        .container-dashboard { max-width: 1100px; width: 100%; margin: 0 auto; }

        /* BOTONES DE ACCIÓN */
        .actions-container { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; }
        .btn-purple { background-color: var(--accent); color: white; border: none; padding: 12px 25px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 10px rgba(121, 134, 203, 0.4); transition: 0.3s; border-radius: 50px; }
        .btn-purple:hover { background-color: #5c6bc0; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(121, 134, 203, 0.6); }

        /* GRID DE CARTAS */
        .grid-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; width: 100%; margin-bottom: 30px; }
        .card { background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); text-align: center; display: flex; flex-direction: column; min-height: 320px; border: 1px solid rgba(255,255,255,0.5); }
        .card-full { grid-column: 1 / -1; }

        h1 { font-size: 1.8rem; color: #222; margin: 0; }
        h2 { font-size: 1.1rem; margin-bottom: 20px; color: #555; font-weight: 600; }
        
        .score-value { font-size: 4rem; font-weight: 800; color: var(--accent); margin: 10px 0; letter-spacing: -2px; }
        
        #scoreMessage { padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 13px; display: inline-block; }
        .msg-good { background: var(--state-good); color: var(--text-good); }
        .msg-bad { background: var(--state-bad); color: var(--text-bad); }

        .chart-container { position: relative; flex-grow: 1; min-height: 200px; width: 100%; }

        /* SECCIÓN MOVIMIENTOS */
        .movimientos-section { background: var(--card); width: 100%; padding: 30px; border-radius: 16px; margin-top: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .lista-movimientos { list-style: none; margin: 20px 0; padding: 0; }
        .lista-movimientos li { padding: 15px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .lista-movimientos li:last-child { border-bottom: none; }
    </style>
</head>
<body>

<script>
    function alternarMenu() {
        document.getElementById('miSidebar').classList.toggle('cerrado');
    }

    document.getElementById('btnCerrarSesion').addEventListener('click', (e) => {
        e.preventDefault();
        window.location.replace('login.html');
    });

    // FUNCIÓN MEJORADA: Con detección de errores
    async function cargarMovimientosDashboard() {
        const lista = document.getElementById('lista-ultimos-movimientos');
        try {
            const response = await fetch('../Back/get_ultimos_movimientos.php');

            // Si el archivo no existe o el PHP falla
            if (!response.ok) {
                lista.innerHTML = `<li>⚠️ No se encontró el archivo PHP (Error ${response.status})</li>`;
                return;
            }

            const result = await response.json();

            if (result.status === "success") {
                if (result.data.length === 0) {
                    lista.innerHTML = '<li>No hay movimientos registrados aún.</li>';
                    return;
                }
                lista.innerHTML = result.data.map(m => {
                    const precio = parseFloat(m.precio) || 0;
                    const color = precio < 0 ? 'var(--text-bad)' : 'var(--text-good)';
                    const signo = precio < 0 ? '' : '+';
                    return `
                        <li>
                            <span><strong>${m.concepto}</strong> <small>(${m.categoria})</small></span>
                            <span style="color: ${color}; font-weight: bold;">${signo}${precio.toFixed(2)}€</span>
                        </li>
                    `;
                }).join('');
            } else {
                lista.innerHTML = `<li>❌ Error: ${result.message}</li>`;
            }
        } catch (e) {
            console.error("Error cargando movimientos:", e);
            lista.innerHTML = '<li>⚠️ Error de conexión. Revisa la consola (F12).</li>';
        }
    }

    // Usamos 'load' para que espere a que TODO esté listo sin pisar otros scripts
    window.addEventListener('load', cargarMovimientosDashboard);

</script>
