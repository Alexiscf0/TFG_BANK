<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestión Kibo</title>
    <script>
        // Verificación de seguridad rápida (Frontend)
        fetch('../Back/comprobar_rol.php')
            .then(res => res.json())
            .then(data => {
                if (!data.logged_in || data.role !== 'admin') {
                    window.location.replace('login.html');
                }
            })
            .catch(() => window.location.replace('login.html'));
    </script>
    <style>
        /* --- ESTILOS BASE (Consistentes con Dashboard) --- */
        :root {
            --bg: #f0f2f5;
            --card: #ffffff;
            --accent: #7986cb;
            --accent-light: #e8eaf6;
            --text-main: #333333;
            --text-muted: #666666;
            --sidebar-width: 260px;
            --sidebar-bg: #ffffff;
            --danger: #ef5350;
            --success: #66bb6a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            height: 100vh; 
            display: flex; 
            overflow: hidden; 
            background: var(--bg); 
            color: var(--text-main);
        }

        /* --- SIDEBAR --- */
        .sidebar { 
            width: var(--sidebar-width); background-color: var(--sidebar-bg); 
            display: flex; flex-direction: column; transition: all 0.4s ease; 
            padding: 20px 15px; border-right: 1px solid rgba(0,0,0,0.05); 
            flex-shrink: 0; z-index: 100;
        }
        .sidebar.cerrado { width: 0; padding: 20px 0; opacity: 0; overflow: hidden; }

        .brand { font-size: 22px; font-weight: 700; color: var(--accent); margin-bottom: 30px; padding-left: 10px; display: flex; align-items: center; gap: 12px; }
        .brand img { height: 32px; width: auto; object-fit: contain; }

        .menu-items { display: flex; flex-direction: column; gap: 5px; flex-grow: 1; }
        .menu-items a { 
            display: flex; align-items: center; text-decoration: none; 
            color: var(--text-muted); font-size: 15px; font-weight: 500;
            padding: 12px 15px; border-radius: 50px; transition: all 0.2s ease; 
        }
        .menu-items a svg { width: 20px; height: 20px; margin-right: 12px; fill: currentColor; opacity: 0.7; }
        .menu-items a:hover { background-color: var(--accent-light); color: var(--accent); }
        .menu-items a.activo-page { background-color: var(--accent-light); color: var(--accent); font-weight: 700; }

        .sidebar-footer { margin-top: auto; border-top: 1px solid #eee; padding-top: 15px; }
        .btn-logout {
            display: flex; align-items: center; justify-content: center; width: 100%;
            padding: 12px; background-color: transparent; color: var(--text-muted);
            border: 1px solid #eee; border-radius: 12px; font-weight: 600; cursor: pointer;
            transition: 0.3s; text-decoration: none;
        }
        .btn-logout:hover { background-color: #ffebee; color: #d32f2f; border-color: #ffcdd2; }
        
        /* ESTILO ESPECIAL ADMIN EN SIDEBAR */
        #linkAdmin { 
            color: #b71c1c; margin-top: 10px; background-color: #fff0f0; 
        }
        #linkAdmin:hover { background-color: #ffebee; }


        /* --- CONTENIDO PRINCIPAL --- */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }

        .header-top { width: 100%; max-width: 1000px; display: flex; align-items: center; margin-bottom: 25px; }
        .btn-menu { 
            font-size: 24px; cursor: pointer; background: white; border: none; 
            color: #555; padding: 8px 12px; border-radius: 8px; margin-right: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.2s;
        }
        .btn-menu:hover { background: #f5f5f5; }
        h1 { font-size: 1.8rem; color: #222; margin: 0; }

        .admin-card {
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 1000px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.8);
        }

        /* Formulario de Creación */
        .form-crear { 
            margin-bottom: 30px; background: #fafafa; padding: 25px; 
            border-radius: 12px; border: 1px dashed #ddd; 
        }
        .form-crear h3 { margin-bottom: 20px; color: #555; font-size: 1.1rem; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        
        .form-crear input { 
            padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; 
            width: 100%; outline: none; transition: 0.3s; 
        }
        .form-crear input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(121, 134, 203, 0.1); }
        
        .btn-add { 
            background: var(--success); color: white; border: none; padding: 12px; 
            border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; 
            transition: 0.2s; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-add:hover { background: #4caf50; transform: translateY(-1px); }

        /* Buscador */
        .search-wrapper { position: relative; margin-bottom: 20px; }
        .search-wrapper input {
            width: 100%; padding: 12px 15px 12px 40px; border-radius: 50px; 
            border: 1px solid #ddd; outline: none; transition: 0.3s;
        }
        .search-wrapper input:focus { border-color: var(--accent); }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #999; }

        /* Tabla de Usuarios */
        .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        
        th { 
            background-color: var(--accent); color: white; padding: 15px; text-align: left; 
            font-weight: 600; letter-spacing: 0.5px;
        }
        td { padding: 15px; border-bottom: 1px solid #f0f0f0; color: #444; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #fafafa; }

        .btn-del { 
            background: #ffebee; color: var(--danger); border: 1px solid #ffcdd2; 
            padding: 6px 15px; border-radius: 50px; cursor: pointer; font-weight: 600; font-size: 13px;
            transition: 0.2s;
        }
        .btn-del:hover { background: var(--danger); color: white; border-color: var(--danger); }

    </style>
</head>
<body>

<aside class="sidebar" id="miSidebar">
    <div class="brand">
        <img src="../images/KiboSaludo.png" alt="Kibo Logo">
        <span>Kibo App</span>
    </div>

    <nav class="menu-items">
        <a href="index.html">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Inicio
        </a>
        <a href="historial.html">
            <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg> Historial
        </a>
        <a href="estadistica.html">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg> Estadísticas
        </a>
        <a href="graficos.html">
            <svg viewBox="0 0 24 24"><path d="M11 2v20c-5.07-.5-9-4.79-9-10s3.93-9.5 9-10zm2.03 0v8.99H22c-.47-4.74-4.24-8.52-8.97-8.99zm0 11.01V22c4.74-.47 8.5-4.25 8.97-8.99h-8.97z"/></svg> Hucha
        </a>
        
        <a href="configadmin.html" id="linkAdmin" class="activo-page" style="display: flex;">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3 3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            Panel Admin
        </a>
    </nav>

    <div class="sidebar-footer">
        <a href="#" id="btnCerrarSesion" class="btn-logout">Cerrar Sesión</a>
    </div>
</aside>

<main class="main-content">
    
    <div class="header-top">
        <button class="btn-menu" onclick="alternarMenu()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <h1>Gestión de Usuarios</h1>
    </div>

    <div class="admin-card">
        <p style="margin-bottom: 25px; color: #666;">Administra los accesos y usuarios de la plataforma Kibo.</p>

        <div class="form-crear">
            <h3>✨ Registrar Nuevo Usuario</h3>
            <form id="formCrear">
                <div class="form-grid">
                    <input type="text" id="newUsername" placeholder="Nombre de usuario" required>
                    <input type="email" id="newEmail" placeholder="Correo electrónico" required>
                    <input type="password" id="newPass" placeholder="Contraseña temporal" required>
                </div>
                <button type="submit" class="btn-add">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    Crear Usuario
                </button>
            </form>
        </div>

        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="buscador" placeholder="Buscar por usuario o email...">
        </div>

        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Email</th>
                    <th>Fecha Registro</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody id="listaUsuarios">
                <tr><td colspan="4" style="text-align: center; color: #888;">Cargando lista de usuarios...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="../Api/nav_check.js"></script>
<script>
    function alternarMenu() {
        document.getElementById('miSidebar').classList.toggle('cerrado');
    }

    // Cierre de sesión
    document.getElementById('btnCerrarSesion').addEventListener('click', (e) => {
        e.preventDefault();
        fetch('../Back/logout.php').finally(() => {
            window.location.replace('login.html');
        });
    });

    // Cargar usuarios desde MongoDB
    async function cargarUsuarios() {
        try {
            const res = await fetch('../Back/get_all_users.php');
            const r = await res.json();
            if (r.status === "success") {
                renderizarTabla(r.data);
            } else {
                console.error(r.message);
            }
        } catch (e) {
            console.error("Error al conectar con la API");
        }
    }

    function renderizarTabla(lista) {
        const tbody = document.getElementById('listaUsuarios');
        if (lista.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px;">No hay usuarios registrados.</td></tr>';
            return;
        }
        tbody.innerHTML = lista.map(u => `
            <tr>
                <td><strong style="color: #333;">${u.username}</strong></td>
                <td>${u.email}</td>
                <td>${u.fecha}</td>
                <td><button class="btn-del" onclick="eliminarUsuario('${u.email}')">Eliminar</button></td>
            </tr>
        `).join('');
    }

    // Eliminar usuario
    async function eliminarUsuario(email) {
        if (!confirm(`¿Estás seguro de que deseas eliminar al usuario con email: ${email}?`)) return;

        try {
            const res = await fetch('../Back/delete_user.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });
            const result = await res.json();
            if (result.status === "success") {
                cargarUsuarios();
            } else {
                alert(result.message);
            }
        } catch (e) {
            alert("Error al intentar eliminar");
        }
    }

    // Crear nuevo usuario
    document.getElementById('formCrear').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData();
        fd.append('username', document.getElementById('newUsername').value);
        fd.append('email', document.getElementById('newEmail').value);
        fd.append('password', document.getElementById('newPass').value);

        const res = await fetch('../Back/create_user_admin.php', {
            method: 'POST',
            body: fd
        });
        const result = await res.json();

        if (result.status === "success") {
            e.target.reset();
            cargarUsuarios();
            alert("Usuario creado correctamente");
        } else {
            alert(result.message);
        }
    });

    // Buscador en tiempo real
    document.getElementById('buscador').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filas = document.querySelectorAll('#listaUsuarios tr');
        filas.forEach(fila => {
            fila.style.display = fila.innerText.toLowerCase().includes(term) ? '' : 'none';
        });
    });

    window.onload = cargarUsuarios;
</script>
</body>
</html>
