<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestión Kibo</title>
    <script>
        fetch('../Back/comprobar_rol.php')
            .then(res => res.json())
            .then(data => {
                if (!data.logged_in || data.role !== 'admin') {
                    window.location.replace('login.html');
                }
            })
            .catch(() => window.location.replace('login.html'));
    </script>
    <style>
        :root { --bg: #e0e0e0; --card: #ffffff; --accent: #7986cb; --sidebar-bg: #7f7f7f; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; height: 100vh; display: flex; overflow: hidden; background: var(--bg); }

        /* SIDEBAR */
        .sidebar { width: 250px; background-color: var(--sidebar-bg); padding: 20px; display: flex; flex-direction: column; transition: width 0.3s; }
        .sidebar.cerrado { width: 0; padding: 0; overflow: hidden; }
        .menu-items { flex-grow: 1; display: flex; flex-direction: column; }
        .menu-items a { display: block; text-decoration: none; color: black; margin-bottom: 20px; padding-left: 10px; border-left: 3px solid transparent; }
        .menu-items a.activo { font-weight: bold; border-left: 3px solid #4b0082; }
        .logout-box { margin-top: auto; background: #58151c; border-radius: 30px; text-align: center; padding: 10px; }
        .logout-box a { color: white !important; text-decoration: none; font-weight: bold; }

        /* CONTENIDO */
        .main-content { flex: 1; padding: 20px; overflow-y: auto; }

        /* BARRA SUPERIOR ACTUALIZADA */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-pill { background: white; padding: 8px 20px; border-radius: 50px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-weight: bold; color: #4b0082; }

        .admin-card { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 1000px; margin: 0 auto; }
        .form-crear { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #eee; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px; width: 100%; }
        .btn-add { background: #2e7d32; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-del { background: #ef5350; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: var(--accent); color: white; }
    </style>
</head>
<body>

<aside class="sidebar" id="miSidebar">
    <h3 style="margin-bottom: 30px; text-align: center;">Kibo App</h3>
    <nav class="menu-items">
        <a href="index.html">- Inicio</a>
        <a href="historial.html">- Historial</a>
        <a href="estadistica.html">- Estadísticas</a>
        <a href="configadmin.html" class="activo">- Panel Admin 👤</a>
        <div class="logout-box"><a href="#" id="btnCerrarSesion">Cerrar Sesión</a></div>
    </nav>
</aside>

<main class="main-content">
    <div class="top-bar">
        <button onclick="alternarMenu()" style="font-size: 25px; background:none; border:none; cursor:pointer;">&#9776;</button>
        <div class="user-pill">👋 Bienvenido, <span id="nombreUsuario">...</span></div>
    </div>

    <div class="admin-card">
        <h1>👥 Gestión de Usuarios</h1>
        <div class="form-crear">
            <h3>Registrar Nuevo Usuario</h3>
            <form id="formCrear">
                <input type="text" id="newUsername" placeholder="Nombre de usuario" required>
                <input type="email" id="newEmail" placeholder="Correo electrónico" required>
                <input type="password" id="newPass" placeholder="Contraseña temporal" required>
                <button type="submit" class="btn-add">Crear Usuario</button>
            </form>
        </div>

        <input type="text" id="buscador" placeholder="Buscar usuarios..." style="margin-bottom:15px;">

        <table>
            <thead>
            <tr><th>Usuario</th><th>Email</th><th>Registro</th><th>Acciones</th></tr>
            </thead>
            <tbody id="listaUsuarios"></tbody>
        </table>
    </div>
</main>

<script>
    function alternarMenu() { document.getElementById('miSidebar').classList.toggle('cerrado'); }

    // NUEVA FUNCIÓN: Mostrar nombre de usuario
    async function mostrarNombre() {
        const res = await fetch('../Back/comprobar_rol.php');
        const data = await res.json();
        document.getElementById('nombreUsuario').innerText = data.username;
    }

    async function cargarUsuarios() {
        const res = await fetch('../Back/get_all_users.php');
        const r = await res.json();
        if (r.status === "success") {
            document.getElementById('listaUsuarios').innerHTML = r.data.map(u => `
                <tr>
                    <td><strong>${u.username}</strong></td>
                    <td>${u.email}</td>
                    <td>${u.fecha}</td>
                    <td><button class="btn-del" onclick="eliminarUsuario('${u.email}')">Eliminar</button></td>
                </tr>
            `).join('');
        }
    }

    document.getElementById('formCrear').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData();
        fd.append('username', document.getElementById('newUsername').value);
        fd.append('email', document.getElementById('newEmail').value);
        fd.append('password', document.getElementById('newPass').value);
        const res = await fetch('../Back/create_user_admin.php', { method: 'POST', body: fd });
        const result = await res.json();
        if (result.status === "success") { e.target.reset(); cargarUsuarios(); }
        else alert(result.message);
    });

    async function eliminarUsuario(email) {
        if (!confirm(`¿Eliminar a ${email}?`)) return;
        await fetch('../Back/delete_user.php', {
            method: 'POST',
            body: JSON.stringify({ email })
        });
        cargarUsuarios();
    }

    document.getElementById('btnCerrarSesion').addEventListener('click', () => {
        fetch('../Back/logout.php').finally(() => window.location.replace('login.html'));
    });

    window.onload = () => {
        mostrarNombre();
        cargarUsuarios();
    };
</script>
</body>
</html>
