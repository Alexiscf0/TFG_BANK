<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piscina de Ahorros</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            background-color: #f0f2f5; padding: 30px; position: relative;
        }
        /* Botón para volver */
        .btn-volver {
            position: absolute; top: 20px; left: 20px;
            text-decoration: none; background: #7f7f7f; color: white;
            padding: 10px 20px; border-radius: 5px; font-weight: bold;
        }

        .escena-container { position: relative; width: 350px; display: flex; flex-direction: column; align-items: center; }
        
        .robot-img {
            width: 200px; height: auto; margin-bottom: -35px; margin-left: -60px;
            z-index: 10; filter: drop-shadow(2px 5px 5px rgba(0,0,0,0.3));
        }

        .piscina-container {
            position: relative; width: 100%; height: 250px;
            border: 8px solid #555; background-color: #e8eaf6;
            border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        .dinero-liquido {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
            /* RUTA CORREGIDA: Sube un nivel (..) y entra en images */
            background-image: url('../images/billetes.png');
            background-repeat: repeat; background-size: 30px auto;
            background-attachment: local; transition: height 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border-top: 2px solid rgba(255,255,255,0.6);
        }

        .controles { margin-top: 40px; padding: 25px; background: #fff; border-radius: 15px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h3 { color: #2e7d32; margin: 0 0 20px 0;}
        button { padding: 12px 24px; margin: 5px; cursor: pointer; border: none; border-radius: 50px; font-weight: bold; color: white; font-size: 16px; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:hover { transform: translateY(-2px); }
        .btn-sumar { background: linear-gradient(135deg, #43a047, #66bb6a); }
        .btn-reset { background: linear-gradient(135deg, #e53935, #ef5350); padding: 10px 20px; font-size: 14px;}

        .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .popup-contenido { text-align: center; animation: entrada 0.6s ease-out; }
        .popup-img { max-width: 80%; max-height: 400px; filter: drop-shadow(0 0 20px gold); }
        @keyframes entrada { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <a href="index.html" class="btn-volver">← Volver al Inicio</a>

    <h1>Meta: ¡Llenar la piscina!</h1>

    <div class="escena-container">
        <img src="../images/KiboTrampolin.png" alt="Robot Saltando" class="robot-img">
        
        <div class="piscina-container">
            <div class="dinero-liquido" id="barra-dinero"></div>
        </div>
    </div>

    <div class="controles">
        <h3>Ahorrado: <span id="texto-porcentaje">0%</span></h3>
        <button class="btn-sumar" onclick="sumarAhorro(10)">+ Ahorrar 10%</button>
        <br>
        <button class="btn-reset" onclick="resetearAhorro()">Reiniciar (Vaciar)</button>
    </div>

    <div class="popup-overlay" id="popupExito" onclick="cerrarPopup()">
        <div class="popup-contenido">
            <img src="../images/KiboCompleto.png" alt="¡Felicidades!" class="popup-img">
        </div>
    </div>

    <script>
        let nivelActual = 0;
        const barra = document.getElementById('barra-dinero');
        const texto = document.getElementById('texto-porcentaje');
        const popup = document.getElementById('popupExito');

        function sumarAhorro(cantidad) {
            nivelActual = nivelActual + cantidad;
            if (nivelActual >= 100) { nivelActual = 100; mostrarExito(); }
            actualizarPantalla();
        }

        function resetearAhorro() { nivelActual = 0; actualizarPantalla(); }

        function actualizarPantalla() {
            barra.style.height = nivelActual + '%';
            texto.innerText = nivelActual + '%';
        }

        function mostrarExito() { popup.style.display = 'flex'; }
        function cerrarPopup() { popup.style.display = 'none'; }
    </script>
</body>
</html>
