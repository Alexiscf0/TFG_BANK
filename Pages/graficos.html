<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kibo - Piscina de Ahorros</title>
    <style>
        /* Estilos mantenidos para consistencia visual */
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .meta-header { background: white; width: 100%; max-width: 500px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; margin-bottom: 30px; border-top: 5px solid #7986cb; }
        .meta-header label { font-weight: bold; color: #555; display: block; margin-bottom: 10px; }
        .meta-header input { font-size: 24px; font-weight: bold; text-align: center; color: #7986cb; border: 2px solid #eee; border-radius: 8px; width: 80%; outline: none; transition: border-color 0.3s; }
        .meta-header input:focus { border-color: #7986cb; }
        .btn-volver { position: absolute; top: 20px; left: 20px; text-decoration: none; background: #7f7f7f; color: white; padding: 8px 15px; border-radius: 5px; font-size: 14px; }
        .escena-container { position: relative; width: 350px; display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
        .robot-img { width: 180px; height: auto; margin-bottom: -30px; margin-left: -50px; z-index: 10; filter: drop-shadow(2px 5px 5px rgba(0,0,0,0.2)); }
        .piscina-container { position: relative; width: 100%; height: 250px; border: 8px solid #555; background-color: #e8eaf6; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.1); }
        .dinero-liquido { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background-image: url('../images/billetes.png'); background-repeat: repeat; background-size: 30px auto; transition: height 1s cubic-bezier(0.4, 0, 0.2, 1); border-top: 2px solid rgba(255,255,255,0.6); }
        .controles { padding: 20px; background: #fff; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        .info-ahorro { font-size: 18px; margin: 15px 0; color: #2e7d32; font-weight: bold; }
        button { width: 100%; padding: 12px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; color: white; font-size: 16px; transition: all 0.2s; margin-bottom: 8px; }
        .btn-update { background: #7986cb; }
        .btn-update:hover { background: #5c6bc0; }
        .btn-reset { background: none; color: #999; font-size: 12px; text-decoration: underline; }
        .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .popup-contenido { text-align: center; animation: entrada 0.6s ease-out; color: white; }
        @keyframes entrada { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<a href="index.html" class="btn-volver">← Inicio</a>

<div class="meta-header">
    <label>🎯 MI META DE AHORRO</label>
    <input type="number" id="input-meta" value="1000"
           onfocus="this.value=''"
           onblur="if(this.value=='') this.value='1000'"
           onchange="actualizarAhorro()">
    <span style="font-weight: bold; color: #7986cb; font-size: 20px;">€</span>
</div>

<div class="escena-container">
    <img src="../images/KiboTrampolin.png" alt="Robot" class="robot-img">
    <div class="piscina-container">
        <div class="dinero-liquido" id="barra-dinero"></div>
    </div>
</div>

<div class="controles">
    <label style="display:block; margin-bottom:10px; font-size:14px; color:#777;">Sumar ahorro hoy (€):</label>
    <div class="input-group">
        <input type="number" id="input-cantidad" placeholder="Ej: 25.50"
               onfocus="this.value=''">
    </div>

    <div class="info-ahorro">
        <span id="texto-dinero">0.00€</span> / <span id="texto-porcentaje">0%</span>
    </div>

    <button class="btn-update" onclick="actualizarAhorro()">Añadir y Guardar</button>
    <button class="btn-reset" onclick="resetearAhorro()">Vaciar Piscina</button>
</div>

<div class="popup-overlay" id="popupExito" onclick="cerrarPopup()">
    <div class="popup-contenido">
        <h2>¡META COMPLETADA! 🚀</h2>
        <img src="../images/KiboCompleto.png" alt="Felicidades" style="max-width:200px;">
    </div>
</div>

<script>
    let acumuladoTotal = 0;

    // Cargar datos al iniciar
    window.onload = async () => {
        try {
            const response = await fetch('../Back/get_savings.php');
            const data = await response.json();
            if (data.status === "success") {
                if(data.meta) document.getElementById('input-meta').value = data.meta;
                acumuladoTotal = data.acumulado || 0;
                renderizarPiscina(data.meta || 1000);
            }
        } catch (e) { console.error("Error al recuperar ahorros persistidos"); }
    };

    async function actualizarAhorro() {
        const metaInput = document.getElementById('input-meta');
        const meta = parseFloat(metaInput.value) || 1000;
        const cantidad = parseFloat(document.getElementById('input-cantidad').value) || 0;

        if (meta <= 0) return;

        acumuladoTotal += cantidad;

        // Guardar en MongoDB Atlas
        try {
            await fetch('../Back/save_savings.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ meta: meta, acumulado: acumuladoTotal })
            });
        } catch (e) { console.error("Error al guardar en la nube"); }

        renderizarPiscina(meta);
        document.getElementById('input-cantidad').value = '';
    }

    function renderizarPiscina(meta) {
        let porcentaje = (acumuladoTotal / meta) * 100;
        let visual = Math.min(porcentaje, 100);

        if (porcentaje >= 100) mostrarExito();

        document.getElementById('barra-dinero').style.height = visual + '%';
        document.getElementById('texto-porcentaje').innerText = Math.floor(porcentaje) + '%';
        document.getElementById('texto-dinero').innerText = acumuladoTotal.toFixed(2) + '€';
    }

    async function resetearAhorro() {
        if(confirm("¿Seguro que quieres vaciar la piscina?")) {
            acumuladoTotal = 0;
            const meta = parseFloat(document.getElementById('input-meta').value) || 1000;
            await fetch('../Back/save_savings.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ meta: meta, acumulado: 0 })
            });
            renderizarPiscina(meta);
        }
    }

    function mostrarExito() { document.getElementById('popupExito').style.display = 'flex'; }
    function cerrarPopup() { document.getElementById('popupExito').style.display = 'none'; }
</script>
</body>
</html>
