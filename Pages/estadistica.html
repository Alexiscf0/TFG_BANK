<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - Kibo App</title>
    <style>
        /* MISMOS ESTILOS BASE QUE INDEX */
        :root {
            --bg: #e0e0e0; --card: #ffffff; --accent: #7986cb; --sidebar-bg: #7f7f7f;
            --text-main: #333333; --state-good: #dcedc8; --text-good: #33691e;
            --state-bad: #ffcdd2; --text-bad: #b71c1c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; height: 100vh; display: flex; overflow: hidden; background: var(--bg); }

        /* SIDEBAR (Igual a Index) */
        .sidebar { width: 250px; background-color: var(--sidebar-bg); color: #000; display: flex; flex-direction: column; overflow: hidden; transition: width 0.3s ease, padding 0.3s ease; padding: 20px; white-space: nowrap; flex-shrink: 0; }
        .sidebar.cerrado { width: 0; padding: 20px 0; border: none; }

        .menu-items {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .menu-items a { display: block; text-decoration: none; color: black; font-size: 18px; margin-bottom: 20px; padding-left: 10px; border-left: 3px solid transparent; }
        .menu-items a:hover { font-weight: bold; border-left: 3px solid #000; }

        /* CONTENIDO PRINCIPAL */
        .main-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .btn-menu { align-self: flex-start; font-size: 30px; cursor: pointer; margin-bottom: 20px; background: none; border: none; color: #333; padding: 0 10px; }

        .container-stats { max-width: 1100px; width: 100%; margin: 0 auto; }

        /* ESTILOS ESPECÍFICOS DE ESTADÍSTICAS */
        .header-stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; }
        .filtros-tiempo button { background: transparent; border: 1px solid var(--accent); color: #333; padding: 5px 15px; border-radius: 20px; cursor: pointer; margin-left: 5px; }
        .filtros-tiempo button.activo, .filtros-tiempo button:hover { background-color: var(--accent); color: white; }

        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card { background: var(--card); padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card h3 { font-size: 1rem; color: #555; margin-bottom: 15px; }
        .card .numero { font-size: 2rem; font-weight: bold; color: var(--text-main); }
        .card .positivo { color: var(--text-good); }
        .card .negativo { color: var(--text-bad); }

        .top-categories { background: var(--card); width: 100%; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .top-categories h2 { font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }

        .cat-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .cat-item:last-child { border-bottom: none; }

        /* BOTÓN CERRAR SESIÓN (Estilo igual al que pediste) */
        .logout-box {
            margin-top: auto;
            padding-top: 20px;
            background-color: #58151c;
            border-radius: 30px;
            text-align: center;
        }
        .logout-box a {
            color: white !important;
            border-left: 3px solid transparent !important;
            font-weight: bold;
            display: block;

            text-decoration: none;
        }
        #linkAdmin { color: #4a0909; font-weight: bold; display: none; }
    </style>
</head>
<body>

<aside class="sidebar" id="miSidebar">
    <h3 style="margin-bottom: 30px; text-align: center;">Kibo App</h3>
    <nav class="menu-items">
        <a href="index.html">- Inicio</a>
        <a href="configadmin.html" id="linkAdmin">- Panel Admin</a>
        <a href="historial.html">- Historial</a>
        <a href="estadistica.html" style="font-weight: bold; border-left: 3px solid #000;">- Estadísticas</a>
        <a href="graficos.html">- Gráficos (Hucha)</a>

        <div style="margin-top: auto; padding: 10px; background-color: #58151c; border-radius: 30px; text-align: center;">
            <a href="#" id="btnCerrarSesion" style="color: white; font-weight: bold; margin: 0; padding: 0; border: none; display: inline-block;">
                Cerrar Sesión
            </a>
        </div>
    </nav>
</aside>

<main class="main-content">
    <button class="btn-menu" onclick="alternarMenu()">&#9776;</button>

    <div class="container-stats">
        <header class="header-stats">
            <h1>Resumen Mensual</h1>
            <div class="filtros-tiempo">
                <button>Semana</button>
                <button class="activo">Mes</button>
                <button>Año</button>
            </div>
        </header>

        <div class="kpi-container">
            <div class="card">
                <h3>Ingresos</h3>
                <div id="kpi-ingresos" class="numero positivo">Cargando...</div>
            </div>
            <div class="card">
                <h3>Gastos</h3>
                <div id="kpi-gastos" class="numero negativo">Cargando...</div>
            </div>
            <div class="card">
                <h3>Ahorro Neto</h3>
                <div id="kpi-ahorro" class="numero" style="color: #7986cb;">Cargando...</div>
            </div>
        </div>

        <div class="top-categories">
            <h2>Categorías con más gasto</h2>
            <div id="lista-categorias">
                <div class="cat-item"><span>🍽️ Restaurantes</span><span style="font-weight: bold;">- 120.00 €</span></div>
                <div class="cat-item"><span>🛒 Supermercado</span><span style="font-weight: bold;">- 85.50 €</span></div>
                <div class="cat-item"><span>⛽ Gasolina</span><span style="font-weight: bold;">- 60.00 €</span></div>
            </div>
        </div>
    </div>
</main>
<script src="../Api/nav_check.js"></script>
<script>
    function alternarMenu() {
        document.getElementById('miSidebar').classList.toggle('cerrado');
    }
    document.getElementById('btnCerrarSesion').addEventListener('click', (e) => {
        e.preventDefault();
        window.location.replace('login.html');
    });

    // Simulación o carga de datos para los KPIs (puedes conectarlo a tu API de movimientos)
    window.addEventListener('load', () => {
        // Ejemplo de llenado manual si no tienes el fetch listo:
        document.getElementById('kpi-ingresos').innerText = "1,250.00 €";
        document.getElementById('kpi-gastos').innerText = "- 430.50 €";
        document.getElementById('kpi-ahorro').innerText = "819.50 €";
    });
</script>

</body>
</html>
