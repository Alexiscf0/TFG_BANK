<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kibo - Agregar Gasto</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #e0e0e0; display: flex; justify-content: center; padding-top: 50px; }
        .form-card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #7986cb; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #5c6bc0; }
    </style>
</head>
<body>
<div class="form-card">
    <h2>Nuevo Movimiento</h2>
    <form action="../Back/procesar_gasto.php" method="POST">
        <label>Concepto:</label>
        <input type="text" name="concepto" placeholder="Ej. Cena con amigos" required>

        <label>Precio (€):</label>
        <input type="number" step="0.01" name="precio" placeholder="0.00" required>

        <label>Categoría:</label>
        <select name="categoria">
            <option value="Ocio">Ocio</option>
            <option value="Comida">Comida</option>
            <option value="Transporte">Transporte</option>
            <option value="Vivienda">Vivienda</option>
            <option value="Otros">Otros</option>
        </select>

        <label>Tipo:</label>
        <select name="tipo">
            <option value="gasto">Gasto (-)</option>
            <option value="ingreso">Ingreso (+)</option>
        </select>

        <button type="submit">Guardar Movimiento</button>
    </form>
    <br>
    <a href="index.html" style="text-decoration: none; color: #777; font-size: 14px;">← Volver</a>
</div>
</body>
</html>
