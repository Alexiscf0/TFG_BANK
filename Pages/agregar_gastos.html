
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kibo - Registro de Movimientos</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .camera-section { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        .btn-scan { background: #5c6bc0; color: white; padding: 12px 20px; border-radius: 25px; cursor: pointer; display: inline-block; font-weight: bold; }
        #preview-container { display: none; margin-top: 15px; }
        #image-preview { max-width: 100%; border-radius: 10px; border: 2px solid #ddd; display: block; margin: 0 auto; }
        .loading { color: #5c6bc0; font-weight: bold; display: none; margin-top: 10px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #666; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn-save { width: 100%; padding: 12px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-back { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #888; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 Nuevo Movimiento</h2>

    <div class="camera-section">
        <input type="file" id="ticketInput" accept="image/*" capture="environment" style="display:none;">
        <label for="ticketInput" class="btn-scan">📸 Escanear Ticket</label>

        <div id="preview-container">
            <img id="image-preview" src="">
            <p id="loading-message" class="loading">⚙️ Procesando...</p>
        </div>
    </div>

    <form id="gastoForm">
        <div class="form-group">
            <label>Tipo:</label>
            <select id="tipo" name="tipo">
                <option value="Gasto">💸 Gasto</option>
                <option value="Ingreso">💰 Ingreso</option>
            </select>
        </div>
        <div class="form-group">
            <label>Concepto:</label>
            <input type="text" id="concepto" name="concepto" required>
        </div>
        <div class="form-group">
            <label>Importe (€):</label>
            <input type="number" id="precio" name="precio" step="0.01" required>
        </div>
        <div class="form-group">
            <label>Categoría:</label>
            <select id="categoria" name="categoria"></select>
        </div>
        <div class="form-group">
            <label>Fecha:</label>
            <input type="date" id="fecha" name="fecha" required>
        </div>
        <button type="submit" class="btn-save">Guardar Movimiento</button>
    </form>
    <a href="index.html" class="btn-back">Volver al inicio</a>
</div>

<script type="module">
    import { analizarTicket } from '../Api/groq_service.js';

    const tipoSelect = document.getElementById('tipo');
    const categoriaSelect = document.getElementById('categoria');
    const ticketInput = document.getElementById('ticketInput');
    const loadingMsg = document.getElementById('loading-message');
    const previewContainer = document.getElementById('preview-container');

    const categorias = {
        Gasto: ["Comida", "Ocio", "Transporte", "Vivienda", "Otros"],
        Ingreso: ["Nómina", "Inversiones", "Regalo", "Venta", "Otros Ingresos"]
    };

    function actualizarCategorias() {
        categoriaSelect.innerHTML = "";
        categorias[tipoSelect.value].forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat; opt.textContent = cat;
            categoriaSelect.appendChild(opt);
        });
    }

    tipoSelect.addEventListener('change', actualizarCategorias);
    actualizarCategorias();

    ticketInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
            const base64 = event.target.result;
            document.getElementById('image-preview').src = base64;

            // Estas líneas ya no darán error de null
            previewContainer.style.display = 'block';
            loadingMsg.style.display = 'block';
            loadingMsg.innerText = "🤖 Kibo leyendo...";

            try {
                const data = await analizarTicket(base64);
                document.getElementById('concepto').value = data.concepto || "";
                document.getElementById('precio').value = data.cantidad || 0;
                document.getElementById('categoria').value = data.categoria || "Otros";
                document.getElementById('fecha').value = data.fecha || "";
                loadingMsg.innerText = "✅ Escaneado";
            } catch (err) {
                loadingMsg.innerText = "❌ Error en el escaneo";
            }
        };
        reader.readAsDataURL(file);
    });

    document.getElementById('gastoForm').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const res = await fetch('../Back/procesar_gasto.php', { method: 'POST', body: fd });
        if (res.ok) window.location.href = "historial.html";
    };
</script>
</body>
</html>
