<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kibo - Registro de Movimientos</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Reutilizamos tu paleta de colores para las alertas */
        :root {
            --accent: #5c6bc0;
            --success: #2e7d32;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        .camera-section { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        .btn-scan { background: var(--accent); color: white; padding: 12px 20px; border-radius: 25px; cursor: pointer; display: inline-block; font-weight: bold; transition: 0.3s; }
        .btn-scan:hover { background: #3f51b5; transform: scale(1.05); }

        #preview-container { display: none; margin-top: 15px; }
        #image-preview { max-width: 100%; border-radius: 10px; border: 2px solid #ddd; }

        .loading { color: var(--accent); font-weight: bold; display: none; margin: 10px 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #666; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }

        .btn-save { width: 100%; padding: 12px; background: var(--success); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-save:hover { background: #1b5e20; }
        .btn-back { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #888; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 Nuevo Movimiento</h2>

    <div class="camera-section">
        <p style="font-size: 14px; color: #666; margin-bottom: 10px;">¿Tienes un ticket? Escanéalo:</p>
        <input type="file" id="ticketInput" accept="image/*" capture="environment" style="display:none;">
        <label for="ticketInput" class="btn-scan">📸 Escanear Ticket</label>

        <div id="preview-container">
            <img id="image-preview">
            <p id="loading-message" class="loading">🤖 Kibo está leyendo el ticket...</p>
        </div>
    </div>

    <form id="gastoForm">
        <div class="form-group">
            <label>Tipo de movimiento:</label>
            <select id="tipo" name="tipo">
                <option value="Gasto" selected>💸 Gasto</option>
                <option value="Ingreso">💰 Ingreso</option>
            </select>
        </div>

        <div class="form-group">
            <label>Comercio / Concepto:</label>
            <input type="text" id="concepto" name="concepto" placeholder="Ej: Mercadona o Nómina" required>
        </div>

        <div class="form-group">
            <label>Importe (€):</label>
            <input type="number" id="precio" name="precio" step="0.01" placeholder="0.00" required>
        </div>

        <div class="form-group">
            <label>Categoría:</label>
            <select id="categoria" name="categoria"></select>
        </div>

        <div class="form-group">
            <label>Fecha:</label>
            <input type="date" id="fecha" name="fecha" required>
        </div>

        <button type="submit" class="btn-save" id="btnGuardar">Guardar Movimiento</button>
    </form>

    <a href="index.html" class="btn-back">Volver al inicio</a>
</div>

<script type="module">
    import { analizarTicket } from '../Api/groq_service.js?v=2026';

    const tipoSelect = document.getElementById('tipo');
    const categoriaSelect = document.getElementById('categoria');
    const ticketInput = document.getElementById('ticketInput');
    const loadingMsg = document.getElementById('loading-message');
    const btnGuardar = document.getElementById('btnGuardar');

    const categorias = {
        Gasto: ["🍔 Comida", "🎉 Ocio", "🚌 Transporte", "🏠 Vivienda", "📦 Otros"],
        Ingreso: ["💼 Nómina", "📈 Inversiones", "🎁 Regalo", "💰 Venta", "➕ Otros Ingresos"]
    };

    function actualizarCategorias() {
        const seleccionado = tipoSelect.value;
        categoriaSelect.innerHTML = "";
        categorias[seleccionado].forEach(cat => {
            const option = document.createElement('option');
            option.value = cat.split(' ')[1];
            option.textContent = cat;
            categoriaSelect.appendChild(option);
        });
    }

    tipoSelect.addEventListener('change', actualizarCategorias);
    actualizarCategorias();

    // 1. Lógica de Escaneo con IA mejorada
    ticketInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
            const base64 = event.target.result;
            document.getElementById('image-preview').src = base64;
            document.getElementById('preview-container').style.display = 'block';
            loadingMsg.style.display = 'block';

            // Usamos una pequeña notificación Toast para no bloquear la pantalla
            const Toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true
            });

            try {
                const datos = await analizarTicket(base64);

                tipoSelect.value = "Gasto";
                actualizarCategorias();

                document.getElementById('concepto').value = datos.concepto || "";
                if (datos.cantidad) {
                    const num = datos.cantidad.toString().replace(',', '.').replace(/[^\d.-]/g, '');
                    document.getElementById('precio').value = parseFloat(num).toFixed(2);
                }

                document.getElementById('categoria').value = datos.categoria || "Otros";
                document.getElementById('fecha').value = datos.fecha || new Date().toISOString().split('T')[0];

                loadingMsg.innerText = "✅ ¡Ticket leído!";
                Toast.fire({ icon: 'success', title: 'Datos extraídos con éxito' });

            } catch (err) {
                loadingMsg.innerText = "❌ Error en el escaneo";
                Swal.fire('Error', 'No se pudo leer el ticket correctamente.', 'error');
                console.error(err);
            }
        };
        reader.readAsDataURL(file);
    });

    // 2. Lógica de Guardado con SweetAlert2
    document.getElementById('gastoForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        btnGuardar.disabled = true;
        btnGuardar.innerText = "Guardando...";

        const formData = new FormData(e.target);

        try {
            const response = await fetch('../Back/procesar_gasto.php', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (result.status === "success") {
                Swal.fire({
                    title: '¡Guardado!',
                    text: `El ${tipoSelect.value.toLowerCase()} se ha registrado correctamente.`,
                    icon: 'success',
                    confirmButtonColor: '#2e7d32'
                }).then(() => {
                    window.location.href = "historial.html";
                });
            } else {
                Swal.fire('Error', result.message, 'error');
                btnGuardar.disabled = false;
                btnGuardar.innerText = "Guardar Movimiento";
            }
        } catch (error) {
            Swal.fire('Error de conexión', 'No se pudo conectar con el servidor.', 'warning');
            btnGuardar.disabled = false;
            btnGuardar.innerText = "Guardar Movimiento";
        }
    });
</script>
</body>
</html>
