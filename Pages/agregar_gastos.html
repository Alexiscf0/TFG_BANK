<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kibo - Escáner de Gastos</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        .camera-section { text-align: center; margin-bottom: 20px; }

        /* Tu botón morado original */
        .btn-scan { background: #5c6bc0; color: white; padding: 12px 20px; border-radius: 25px; cursor: pointer; display: inline-block; font-weight: bold; transition: background 0.3s; }
        .btn-scan:hover { background: #3f51b5; }

        #preview-container { display: none; margin-top: 15px; }
        #image-preview { max-width: 100%; border-radius: 10px; border: 2px solid #ddd; }
        .loading { color: #5c6bc0; font-weight: bold; display: none; margin: 10px 0; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #666; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: all 0.3s; }

        /* Colores dinámicos para el selector */
        .select-ingreso { color: #2e7d32; border-color: #2e7d32; font-weight: bold; }
        .select-gasto { color: #c62828; border-color: #c62828; font-weight: bold; }

        .btn-save { width: 100%; padding: 12px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-save:hover { background: #1b5e20; }
        .btn-back { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #888; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Registrar Movimiento</h2>

    <div class="camera-section">
        <input type="file" id="ticketInput" accept="image/*" capture="environment" style="display:none;">
        <label for="ticketInput" class="btn-scan">Hacer Foto o Subir</label>

        <div id="preview-container">
            <img id="image-preview">
            <p id="loading-message" class="loading">🤖 Kibo está leyendo el ticket...</p>
        </div>
    </div>

    <form id="gastoForm">
        <div class="form-group">
            <label>Comercio / Concepto:</label>
            <input type="text" id="concepto" name="concepto" required>
        </div>

        <div class="form-group">
            <label>Importe (€):</label>
            <input type="number" id="precio" name="precio" step="0.01" required>
        </div>

        <div class="form-group">
            <label>Categoría:</label>
            <select id="categoria" name="categoria">
                <option value="Otros">📦 Otros</option>
                <option value="Comida">🍔 Comida</option>
                <option value="Ocio">🎉 Ocio</option>
                <option value="Transporte">🚌 Transporte</option>
                <option value="Hogar">🏠 Hogar</option>
                <option value="Nómina">💰 Nómina</option>
            </select>
        </div>

        <div class="form-group">
            <label>Fecha:</label>
            <input type="date" id="fecha" name="fecha" required>
        </div>

        <div class="form-group">
            <label>Tipo de movimiento:</label>
            <select id="tipo" name="tipo" class="select-gasto">
                <option value="gasto" style="color: #c62828;">Gasto 🔻</option>
                <option value="ingreso" style="color: #2e7d32;">Ingreso 🔺</option>
            </select>
        </div>

        <button type="submit" class="btn-save">Guardar Movimiento</button>
    </form>

    <a href="index.html" class="btn-back">Volver al inicio</a>
</div>

<script type="module">
    import { analizarTicket } from '../Api/groq_service.js';

    const ticketInput = document.getElementById('ticketInput');
    const tipoSelect = document.getElementById('tipo');
    const loadingMsg = document.getElementById('loading-message');

    // Cambiar color del selector automáticamente
    tipoSelect.addEventListener('change', () => {
        if (tipoSelect.value === 'ingreso') {
            tipoSelect.classList.remove('select-gasto');
            tipoSelect.classList.add('select-ingreso');
        } else {
            tipoSelect.classList.remove('select-ingreso');
            tipoSelect.classList.add('select-gasto');
        }
    });

    // Escaneo con IA
    ticketInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
            const base64 = event.target.result;
            document.getElementById('image-preview').src = base64;
            document.getElementById('preview-container').style.display = 'block';
            loadingMsg.style.display = 'block';

            try {
                const datos = await analizarTicket(base64);
                document.getElementById('concepto').value = datos.concepto || "";

                if (datos.precio) {
                    const num = datos.precio.toString().replace(',', '.').replace(/[^\d.-]/g, '');
                    document.getElementById('precio').value = parseFloat(num).toFixed(2);
                }

                document.getElementById('categoria').value = datos.categoria || "Otros";
                document.getElementById('fecha').value = datos.fecha || new Date().toISOString().split('T')[0];

                // Si es ingreso, cambiamos el color de la barra
                if(datos.tipo === "ingreso" || datos.categoria === "Nómina") {
                    tipoSelect.value = "ingreso";
                    tipoSelect.classList.replace('select-gasto', 'select-ingreso');
                }

                loadingMsg.innerText = "✅ Datos listos";
            } catch (err) {
                loadingMsg.innerText = "❌ Error al leer";
                console.error(err);
            }
        };
        reader.readAsDataURL(file);
    });

    // Guardado en MongoDB
    document.getElementById('gastoForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);

        try {
            const response = await fetch('../Back/procesar_gasto.php', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            if (result.status === "success") {
                window.location.href = "historial.html";
            } else {
                alert("Error: " + result.message);
            }
        } catch (error) {
            alert("Fallo de conexión");
        }
    });
</script>

</body>
</html>
