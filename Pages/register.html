<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Tradicional</title>
</head>
<body>
<h2>Crear Cuenta</h2>
<form action="../Back/register.php" method="POST">
    <label>Nombre de Usuario:</label>
    <input type="text" name="username" placeholder="Ej: Juanito123" required>
    <br><br>

    <label>Email:</label>
    <input type="email" name="email" placeholder="tu@email.com" required>

    <br><br>
    <label>Contraseña:</label>
    <input type="password" name="password" placeholder="********" required>
    <br><br>

    <button type="submit">Registrarse</button>
</form>

<p>¿Ya tienes cuenta? <a href="../Pages/login.html">Inicia Sesión</a></p>
</body>
<script>
    document.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const form = e.target;
        const formData = new FormData(form);

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData
            });

            // Verificamos si la respuesta es exitosa (status 200-299)
            if (!response.ok) throw new Error("Error en el servidor");

            const result = await response.json();

            if (result.status === "success") {
                alert(result.message);
                window.location.href = result.redirect;
            } else {
                alert(result.message);
            }
        } catch (error) {
            console.error("Error:", error);
            alert("No se pudo completar el registro. Inténtalo más tarde.");
        }
    });
</script>
</html>
