<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - Kibo</title>
    <style>
        :root {
            --bg: #f0f2f5; --card: #ffffff; --accent: #7986cb;
            --accent-light: #e8eaf6; --text-main: #333333;
            --text-muted: #666666; --sidebar-width: 260px; --sidebar-bg: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; background-color: var(--bg); overflow: hidden; }
        .sidebar { width: var(--sidebar-width); background-color: var(--sidebar-bg); display: flex; flex-direction: column; transition: 0.4s; padding: 20px 15px; border-right: 1px solid rgba(0,0,0,0.05); flex-shrink: 0; z-index: 100; }
        .sidebar.cerrado { width: 0; padding: 20px 0; opacity: 0; overflow: hidden; }
        .brand { font-size: 22px; font-weight: 700; color: var(--accent); margin-bottom: 30px; padding-left: 47px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .brand img { height: 32px; width: auto; object-fit: contain; }
        .menu-items { display: flex; flex-direction: column; gap: 5px; flex-grow: 1; }
        .menu-items a { display: flex; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 15px; padding: 12px 15px; border-radius: 50px; transition: 0.2s; }
        .menu-items a svg { width: 20px; height: 20px; margin-right: 12px; fill: currentColor; opacity: 0.7; }
        .menu-items a:hover, .menu-items a.activo-page { background-color: var(--accent-light); color: var(--accent); font-weight: 700; }
        .btn-logout { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 12px; font-weight: 600; cursor: pointer; text-decoration: none; color: var(--text-muted); }
        .main-content { flex: 1; padding: 30px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-shrink: 0; }
        .table-wrapper { background-color: var(--card); border-radius: 16px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); overflow: auto; flex-grow: 1; border: 1px solid rgba(255,255,255,0.5); }
        table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: left; min-width: 600px; }
        thead th { position: sticky; top: 0; background-color: var(--accent); color: white; padding: 18px; }
        td { padding: 18px; border-bottom: 1px solid #f0f0f0; }
        .monto-positivo { color: #2e7d32; font-weight: bold; background: #e8f5e9; padding: 5px 10px; border-radius: 8px; }
        .monto-negativo { color: #c62828; font-weight: bold; background: #ffebee; padding: 5px 10px; border-radius: 8px; }
        #th-fecha { cursor: pointer; user-select: none; }
    </style>
</head>
<body>

<aside class="sidebar" id="miSidebar">
    <div class="brand" onclick="window.location.href='index.html'">
        <img src="../images/Kibo.png" alt="Kibo Logo"><span>Kibo</span>
    </div>
    <nav class="menu-items">
        <a href="index.html"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Inicio</a>
        <a href="historial.html" class="activo-page"><svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg> Historial</a>
        <a href="estadistica.html"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg> Estadísticas</a>
        <a href="presupuestos.html"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3 3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg> Presupuestos</a>
    </nav>
    <div class="sidebar-footer"><a href="#" id="btnCerrarSesion" class="btn-logout">Cerrar Sesión</a></div>
</aside>

<main class="main-content">
    <div class="header-top">
        <div style="display: flex; align-items: center; gap: 20px;">
            <button class="btn-menu" onclick="document.getElementById('miSidebar').classList.toggle('cerrado')"> ☰ </button>
            <h1>Historial de Movimientos</h1>
        </div>
        <select id="filtroCategoria" class="filtro-select">
            <option value="Todas">📂 Todas las categorías</option>
            <option value="Comida">🍽️ Comida</option>
            <option value="Ocio">🎮 Ocio</option>
            <option value="Transporte">🚗 Transporte</option>
            <option value="Vivienda">🏠 Vivienda</option>
            <option value="Otros">📦 Otros</option>
        </select>
    </div>
    <div class="table-wrapper">
        <table>
            <thead><tr><th id="th-fecha">Fecha 🔽</th><th>Concepto</th><th>Categoría</th><th>Cantidad</th></tr></thead>
            <tbody id="tabla-movimientos-body"></tbody>
        </table>
    </div>
</main>

<script src="../Api/nav_check.js"></script>
<script src="../Api/nav_check.js"></script>
<script>
    let todosLosMovimientos = [];
    let ordenAscendente = false;

    document.addEventListener('DOMContentLoaded', async () => {
        const tablaBody = document.getElementById('tabla-movimientos-body');
        try {
            const response = await fetch('../Back/movimientos.php');
            const datos = await response.json();
            if (datos.status === "error") { window.location.href = "login.html"; return; }
            todosLosMovimientos = datos;
            ordenarMovimientos();
            document.getElementById('th-fecha').addEventListener('click', () => {
                ordenAscendente = !ordenAscendente;
                ordenarMovimientos();
            });
            document.getElementById('filtroCategoria').addEventListener('change', aplicarFiltrosYRenderizar);
        } catch (e) { tablaBody.innerHTML = '<tr><td colspan="4">Error de conexión</td></tr>'; }
    });

    function ordenarMovimientos() {
        todosLosMovimientos.sort((a, b) => {
            const comp = a.fecha.localeCompare(b.fecha);
            if (comp !== 0) return ordenAscendente ? comp : -comp;
            return ordenAscendente ? a.id.localeCompare(b.id) : b.id.localeCompare(a.id);
        });
        document.getElementById('th-fecha').innerText = ordenAscendente ? 'Fecha 🔼' : 'Fecha 🔽';
        aplicarFiltrosYRenderizar();
    }

    function aplicarFiltrosYRenderizar() {
        const cat = document.getElementById('filtroCategoria').value;
        const filtrados = (cat === "Todas") ? todosLosMovimientos : todosLosMovimientos.filter(m => m.categoria === cat);
        renderizarTabla(filtrados);
    }

    function renderizarTabla(lista) {
        const tbody = document.getElementById('tabla-movimientos-body');
        tbody.innerHTML = lista.map(mov => {
            const monto = parseFloat(mov.precio || 0);
            const clase = monto >= 0 ? 'monto-positivo' : 'monto-negativo';
            return `<tr><td>${mov.fecha}</td><td>${mov.concepto}</td><td><span class="tag">${mov.categoria}</span></td><td><span class="${clase}">${monto.toFixed(2)}€</span></td></tr>`;
        }).join('');
    }
</script>
</body>
</html>
