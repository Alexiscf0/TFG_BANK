<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <div><h2>Login</h2>
    <form  action="login.php" method="POST" id="loginForm" onsubmit="iniciarSesion(event)">
        
        <label>Email:</label>
        <input type ="email" id="email" placeholder="tu@email.com">
        
        <label>Contraseña:</label>
        <input type="password" id="password" placeholder="********">
        

        <button type="submit">Acceder</button>

        <p>
            ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
        </p>
        </div>
    </form>
    <script>
        async function registrarUsuario(event){
            event.preventDefault();

            const emailCapturado = document.getElementById('email').value;
            const passwordCapturada = document.getElementById('password').value;
            
            const datosAEnviar = {
                email: emailCapturado,
                password: passwordCapturada
            };

            const urlDestino = 'http://localhost/Kibo/BaseDatos/register.php'; 

            try {
                const respuesta = await fetch(urlDestino, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datosAEnviar)
                });

                if (respuesta.ok) {
                    alert("Usuario creado.");
                    window.location.href = 'login.html';
                } else {
                    alert("Error al registrar (quizás el email ya existe)");
                }
            } catch (error) {
                console.error("Error de conexión:", error);
                alert("No se pudo conectar con el servidor");
            }
        }
    </script>
</body>
</html>
