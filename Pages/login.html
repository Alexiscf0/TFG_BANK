<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kibo - Login</title>
    <style>
        /* PALETA DE COLORES KIBO */
        :root {
            --bg: #e0e0e0;
            --card: #ffffff;
            --accent: #7986cb;
            --accent-dark: #5c6bc0;
            --text-main: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            color: var(--text-main);
        }

        .login-card {
            background: var(--card);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        /* AJUSTE DE IMAGEN PARA QUE SE VEA PERFECTA */
        .logo-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        .logo-container img {
            width: 120px;
            height: auto;
            max-height: 120px;
            object-fit: contain;
            display: block;
        }

        h2 {
            margin: 0 0 25px 0;
            font-weight: 600;
            color: #000;
        }

        form {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(121, 134, 203, 0.2);
        }

        /* BOTONES */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        button {
            background-color: var(--accent);
            color: black;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: var(--accent-dark);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            text-decoration: none;
            display: block;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-secondary:hover {
            background-color: rgba(121, 134, 203, 0.1);
            color: var(--accent-dark);
            border-color: var(--accent-dark);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="login-card">
    
    <div class="logo-container">
        <img src="../images/Kibo.png" alt="Kibo Logo">
    </div>

    <h2>Iniciar Sesión</h2>
    
    <form action="../Back/login.php" method="POST">
        <label>Usuario:</label>
        <input type="text" name="username" placeholder="Tu nombre de usuario" required>

        <label>Contraseña:</label>
        <input type="password" name="password" placeholder="********" required>

        <div class="btn-container">
            <button type="submit">Acceder</button>
            <a href="register.html" class="btn-secondary">Crear nueva cuenta</a>
        </div>
    </form>
</div>

<script>
    document.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const form = e.target;
        const formData = new FormData(form);

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData
            });

            // Verificamos si la respuesta es JSON antes de parsear
            const result = await response.json();

            if (result.status === "success") {
                Swal.fire({
                    title: '¡Bienvenido!',
                    text: result.message,
                    icon: 'success',
                    confirmButtonColor: '#7986cb',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = result.redirect;
                });
            } else {
                Swal.fire({
                    title: 'Error de acceso',
                    text: result.message,
                    icon: 'error',
                    confirmButtonColor: '#7986cb'
                });
            }
        } catch (error) {
            console.error("Error en la petición:", error);
            Swal.fire({
                title: 'Error técnico',
                text: 'No se pudo conectar con el servidor.',
                icon: 'warning',
                confirmButtonColor: '#7986cb'
            });
        }
    });
</script>
</body>
</html>
